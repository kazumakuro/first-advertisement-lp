    <!-- css -->

<link rel="icon" type="image/svg+xml" href="../favicon.svg">

<body>
   <div class="line-bc"><!--headerとfooter固定用-->

      <div class="send">
        <div class="faceicon">

    <footer>

    <script>
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
        
        
        window.addEventListener('resize', () => {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
        });
        </script>
